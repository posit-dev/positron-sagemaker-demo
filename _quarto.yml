project:
  type: default
  # Every file is named here, and no pattern is used, so a render never picks
  # up another .qmd by accident. The walkthroughs are listed because a project
  # render then checks that they still work. Only the two reports go to Posit
  # Connect.
  render:
    - reports/aurora_lending/portfolio_risk_review.qmd
    - reports/helix_trials/enrollment_safety_review.qmd
    - analysis/walkthrough_finance.qmd
    - analysis/walkthrough_lifesci.qmd
    # R parallels of the four files above. Same queries, same endpoints,
    # tidyverse/tidymodels instead of pandas/scikit-learn.
    - reports/aurora_lending/portfolio_risk_review_r.qmd
    - reports/helix_trials/enrollment_safety_review_r.qmd
    - analysis/walkthrough_finance_r.qmd
    - analysis/walkthrough_lifesci_r.qmd

# NOTE: there is no `format:` block here. Each report holds its own complete
# format, which is the theme, the brand, embed-resources, and the figure sizes.
# A report therefore looks the same whether this project renders it, or Posit
# Connect renders it alone. If the format were in both places, the two can
# disagree, and only on the path that nobody tests.
execute:
  echo: false
  warning: false
  message: false
  freeze: false
