$version: 0.1.0
$learn_more: https://data-dict.tidyverse.org/

name: Aurora Lending portfolio
summary: >-
  Synthetic consumer-loan portfolio for Aurora Lending Group, a fictional
  lender. The data is suitable for demonstrations only.
details: >-
  The portfolio contains originated loans with performance measured as of
  2025-12-31. Aurora's synthetic credit policy excludes applicants below a
  FICO score of 580. The charged_off outcome was generated by a log-odds model
  and is not an observed real-world loss event.

version:
  date: '2026-09-15'

tables:
  - name: fct_loan_performance
    description: >-
      One row per originated loan, including terms, credit attributes, current
      balance, delinquency, and realized charge-off status as of 2025-12-31.
    columns:
      - name: loan_id
        type: number(id)
        constraints: [primary_key]
        description: Unique loan key.
      - name: borrower_id
        type: number(id)
        constraints: [foreign_key]
        description: Joins to dim_borrower.borrower_id.
      - name: product_id
        type: number(id)
        constraints: [foreign_key]
        description: Joins to dim_loan_product.product_id.
      - name: origination_date
        type: date
        description: Date the loan was funded.
      - name: principal_amount
        type: number(currency)
        description: Original amount advanced, in US dollars.
      - name: outstanding_balance
        type: number(currency)
        description: Remaining balance as of 2025-12-31, in US dollars.
      - name: apr
        type: number(proportion)
        description: Contract annual percentage rate after risk-based pricing.
      - name: fico_at_origination
        type: number(quantity)
        description: FICO score at funding; values are at least 580.
      - name: dti
        type: number(proportion)
        description: Debt-to-income ratio including this loan.
      - name: term_months
        type: number(quantity)
        description: Contractual term in months.
      - name: purpose
        type: enum
        values:
          - debt_consolidation
          - credit_card_refi
          - home_improvement
          - auto_refinance
          - medical
          - small_business
          - education
        description: Stated use of funds, copied from the loan product.
      - name: employment_length_years
        type: number(quantity)
        description: Borrower's years in current employment at origination.
      - name: months_on_book
        type: number(quantity)
        description: Months since origination, capped at the full loan term.
      - name: delinquency_days
        type: number(quantity)
        description: Days past due; 120 or more corresponds to charge-off.
      - name: charged_off
        type: boolean
        description: True when the synthetic loan outcome is charge-off.

  - name: dim_borrower
    description: One row per synthetic borrower, with application attributes.
    columns:
      - name: borrower_id
        type: number(id)
        constraints: [primary_key]
        description: Unique borrower key.
      - name: state
        type: string
        description: Two-letter US state code.
      - name: income_band
        type: string
        description: Banded stated annual income.
      - name: annual_income
        type: number(currency)
        description: Stated annual income in US dollars.
      - name: credit_score_band
        type: string
        description: Banded FICO score at application.
      - name: homeownership
        type: enum
        values: [rent, mortgage, own]
        description: Housing status at application.

  - name: dim_loan_product
    description: One row per lending product offered by Aurora.
    columns:
      - name: product_id
        type: number(id)
        constraints: [primary_key]
        description: Unique product key.
      - name: product_name
        type: string
        description: Customer-facing product name.
      - name: purpose
        type: string
        description: Stated use of funds associated with the product.
      - name: term_months
        type: number(quantity)
        description: Contractual term in months.
      - name: base_apr
        type: number(proportion)
        description: Product floor APR before risk-based pricing.

relationships:
  - join: fct_loan_performance.borrower_id = dim_borrower.borrower_id
    cardinality: many-to-one
  - join: fct_loan_performance.product_id = dim_loan_product.product_id
    cardinality: many-to-one

glossary:
  charge-off rate: >-
    The proportion of loans whose charged_off value is true. It is a loan-count
    rate, not a dollar loss rate.
  origination vintage: >-
    The calendar year in which a loan was funded. Recent vintages have had less
    time to accumulate charge-offs and are not directly mature-comparable with
    older vintages.
