# A description of every column in the two demo datasets.
#
# data/generate.py makes both of them, and both are synthetic. They are
# alternative demos for different sessions.
version: 1
generated_by: data/generate.py
disclaimer: >
  All data is synthetic and created for demonstration purposes only. Aurora
  Lending Group, Helix Therapeutics and study HLX-301 are fictional.

databases:

  aurora_lending:
    company: Aurora Lending Group
    industry: financial services
    grain: one row for each loan in fct_loan_performance
    model_target: charged_off
    notes: >
      The credit policy of Aurora refuses an applicant below 580 FICO, so no
      loan in the book is below that score. A log-odds model makes the
      charge-off outcome. A logistic regression therefore recovers a scorecard
      that a credit risk team can read.
    tables:

      dim_date:
        description: Calendar dimension covering the origination window.
        columns:
          date_key: {type: int, constraints: [primary_key], description: Date as YYYYMMDD.}
          full_date: {type: date, description: Calendar date.}
          year: {type: smallint, description: Calendar year.}
          quarter: {type: tinyint, description: Calendar quarter, 1-4.}
          month: {type: tinyint, description: Month number, 1-12.}
          month_name: {type: string, description: Full month name.}
          day_of_month: {type: tinyint, description: Day of month.}
          day_of_week: {type: tinyint, description: Monday=0 through Sunday=6.}
          day_name: {type: string, description: Full weekday name.}
          is_weekend: {type: boolean, description: True for Saturday and Sunday.}

      dim_loan_product:
        description: The eight lending products Aurora offers.
        columns:
          product_id: {type: smallint, constraints: [primary_key], description: Product key.}
          product_name: {type: string, description: Customer-facing product name.}
          term_months: {type: smallint, values: [24, 36, 48, 60, 84], description: Contractual term.}
          purpose: {type: string, description: "Stated use of funds: debt_consolidation, credit_card_refi, home_improvement, auto_refinance, medical, small_business, education."}
          base_apr: {type: double, description: Product floor APR before risk-based pricing.}

      dim_borrower:
        description: Borrower attributes as captured at application.
        columns:
          borrower_id: {type: int, constraints: [primary_key], description: Borrower key.}
          age_band: {type: string, values: ["18-24", "25-34", "35-44", "45-54", "55-64", "65+"], description: Banded age.}
          state: {type: string, description: US state, two-letter code.}
          income_band: {type: string, description: Banded annual income.}
          annual_income: {type: "decimal(12,2)", description: Stated annual income in USD.}
          employment_length_years: {type: double, description: Years in current employment.}
          credit_score_band: {type: string, description: Banded FICO at application.}
          fico_score: {type: smallint, constraints: [">= 580"], description: FICO at application.}
          homeownership: {type: string, values: [rent, mortgage, own], description: Housing status.}

      fct_loan_performance:
        description: One row per originated loan, with performance as of 2025-12-31.
        columns:
          loan_id: {type: int, constraints: [primary_key], description: Loan key.}
          borrower_id: {type: int, constraints: [foreign_key], description: References dim_borrower.}
          product_id: {type: smallint, constraints: [foreign_key], description: References dim_loan_product.}
          origination_date_key: {type: int, constraints: [foreign_key], description: References dim_date.}
          origination_date: {type: date, description: Funding date.}
          principal_amount: {type: "decimal(12,2)", description: Amount advanced, USD.}
          apr: {type: double, description: Contract APR after risk-based pricing.}
          fico_at_origination: {type: smallint, description: FICO at funding.}
          dti: {type: double, description: Debt-to-income ratio including this loan.}
          term_months: {type: smallint, description: Contractual term.}
          purpose: {type: string, description: A copy from dim_loan_product, to make queries simpler.}
          employment_length_years: {type: double, description: A copy from dim_borrower.}
          months_on_book: {type: smallint, description: Months since origination, up to the full term.}
          delinquency_days: {type: smallint, description: Days past due. 120 or more means a charge-off.}
          outstanding_balance: {type: "decimal(12,2)", description: Remaining balance, USD.}
          charged_off: {type: boolean, description: The model target. True if the loan was charged off.}

  helix_trials:
    company: Helix Therapeutics
    industry: life sciences
    study: HLX-301, randomized placebo-controlled Phase III
    grain: one row for each subject visit in fct_visit_observations
    model_target: discontinued (on dim_subject)
    notes: >
      The model predicts a subject-level outcome, so the target lives on
      dim_subject and not on the fact table. Group the visit history over a
      fixed early window first, which is visit_id <= 5, Screening to Week 12,
      and then join. If you join on a later visit first, the query removes
      every subject who already withdrew, and reports a dropout rate that is
      too low. A count over the whole study also depends on exposure.
    tables:

      dim_visit:
        description: The twelve-visit protocol schedule.
        columns:
          visit_id: {type: smallint, constraints: [primary_key], description: Visit key, 1-12.}
          visit_name: {type: string, description: "The protocol label for the visit, for example Week 24."}
          scheduled_day: {type: smallint, description: The protocol day, counted from baseline. Screening is -14.}
          is_efficacy_visit: {type: boolean, description: True from baseline onward.}

      dim_site:
        description: Investigator sites participating in the study.
        columns:
          site_id: {type: smallint, constraints: [primary_key], description: Site key.}
          site_name: {type: string, description: Site label.}
          country: {type: string, description: Site country.}
          region: {type: string, values: ["North America", "Western Europe", "Eastern Europe", "Asia Pacific"], description: Geographic region.}
          investigator: {type: string, description: Principal investigator.}
          activation_date: {type: date, description: The date the site opened for enrollment.}

      dim_subject:
        description: One row per randomized subject, including the retention outcome.
        columns:
          subject_id: {type: string, constraints: [primary_key], description: Subject identifier, Snnnnn.}
          site_id: {type: smallint, constraints: [foreign_key], description: References dim_site.}
          arm: {type: string, values: [Treatment, Placebo], description: Randomized arm, 1:1.}
          age: {type: smallint, description: Age at enrollment.}
          sex: {type: string, values: [Female, Male], description: Recorded sex.}
          ecog_status: {type: tinyint, values: [0, 1, 2], description: ECOG performance status. A higher number is worse.}
          bmi: {type: double, description: Body mass index at baseline.}
          prior_therapy_lines: {type: tinyint, values: [0, 1, 2, 3], description: Prior lines of therapy.}
          baseline_das: {type: double, description: Disease activity score at baseline, 0 to 10. A higher number is worse.}
          enrollment_date: {type: date, description: Randomization date.}
          enrollment_date_key: {type: int, description: Randomization date as YYYYMMDD.}
          discontinued: {type: boolean, description: The model target. True if the subject left the study early.}
          last_visit_id: {type: smallint, description: Final visit attended.}
          early_ae_count: {type: smallint, description: Adverse events recorded through Week 12.}

      fct_visit_observations:
        description: One row for each visit that happened. A subject who leaves the study has no row after the final visit.
        columns:
          observation_id: {type: int, constraints: [primary_key], description: Observation key.}
          subject_id: {type: string, constraints: [foreign_key], description: References dim_subject.}
          visit_id: {type: smallint, constraints: [foreign_key], description: References dim_visit.}
          site_id: {type: smallint, constraints: [foreign_key], description: References dim_site.}
          study_day: {type: smallint, description: The day the visit happened, a few days from the protocol day.}
          das_score: {type: double, description: Disease activity score at this visit, 0-10.}
          systolic_bp: {type: smallint, description: Systolic blood pressure, mmHg.}
          diastolic_bp: {type: smallint, description: Diastolic blood pressure, mmHg.}
          heart_rate: {type: smallint, description: Heart rate, bpm.}
          weight_kg: {type: double, description: Weight in kilograms.}
          adverse_event_flag: {type: boolean, description: An adverse event was recorded at this visit.}
          visit_completed: {type: boolean, description: False if the subject missed the visit. Missed visits come before a withdrawal.}
